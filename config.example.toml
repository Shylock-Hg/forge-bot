# Example configuration for forge-bot.
#
# Copy to `forge-bot.toml` and adjust. Secrets can be supplied through the
# environment instead of this file:
#
#   FORGEJO_WEBHOOK_SECRET, FORGEJO_TOKEN, FORGEJO_BASE_URL,
#   FORGEJO_BOT_USERNAME, FORGE_BOT_BIND, FORGE_BOT_MENTION,
#   FORGE_BOT_DEFAULT_AGENT, FORGE_BOT_MAX_CONCURRENCY,
#   FORGE_BOT_WORKSPACE_ROOT, FORGE_BOT_SESSION_DIR

bind = "0.0.0.0:8080"
mention = "@agent"
default_agent = "codex"

[forgejo]
base_url = "http://forgejo.example.com:3000"
# webhook_secret = "change-me"
# token = "change-me"
bot_username = "forge-bot"

[policy]
# `allow_all = true` disables authorization entirely. Use only for local
# testing.
allow_all = false
# A user is allowed when it appears here; an empty list means "any user".
allowed_users = ["admin"]
# A repository is allowed when it appears here; an empty list means "any repo".
# At least one of the two lists must be non-empty unless `allow_all` is set.
allowed_repos = ["org/repo"]

[workspace]
# Clone the repository before invoking an agent.
enabled = true
root = "/var/lib/forge-bot/workspaces"
reuse = true
git_author_name = "forge-bot"
git_author_email = "forge-bot@localhost"

[reply]
# Post "on it" when a job starts.
ack = true
# Post the result when a job finishes. Disable if agents reply themselves.
result = true

[capacity]
# When an agent's output looks like a quota, rate-limit or capacity/overload
# error, mark it unavailable for `cooldown_secs` and (if `fallback` is true)
# retry the job on the next available agent. When no agent is left the bot
# replies "No available agent". `[quota]` is accepted as an alias.
fallback = true
# Five hours, matching the typical agent quota/reset window.
cooldown_secs = 18000
# Extra, case-insensitive phrases that count as a capacity message, in
# addition to the built-in markers ("usage limit", "rate limit", "too many
# requests", "quota exceeded", "overloaded", "at capacity", "503 Service
# Unavailable", ...).
markers = []

[session]
dir = "/var/lib/forge-bot/state"
workers = 2
queue_capacity = 256
recover = true

# --- agents -----------------------------------------------------------------
#
# Each adapter has sensible defaults; any field can be overridden. A custom
# adapter only needs a `command`.

[agents.codex]
timeout_secs = 1800
# dangerously_skip_permissions = false

[agents.pi]
command = "pi"
args = ["--print", "--mode", "text"]
timeout_secs = 1800

[agents.claude]
command = "claude"
args = ["--print"]
timeout_secs = 1800

# [agents.kimi]
# command = "kimi"
# args = ["--print"]

# A completely custom adapter:
# [agents.my-agent]
# command = "my-agent"
# args = ["--non-interactive"]
# prompt = "stdin" # or "arg"
# timeout_secs = 3600
# [agents.my-agent.env]
# MY_AGENT_FLAG = "1"

# --- long-lived Pi RPC agent pool -------------------------------------------
#
# The `pi-rpc` adapter keeps `pi --mode rpc` processes alive and reuses an idle
# agent for the same workspace, spawning a new one when all are busy.
[pi_rpc]
command = "pi"
max_agents = 2
idle_ttl_secs = 900
# Wall-clock limit for a single request. 0 disables the limit so an agent
# runs to completion instead of being killed when a timer expires.
timeout_secs = 0
approve = true
no_session = true
# model = "deepseek-flash"
# provider = "deepseek"
# args = []

# --- polling ingester -------------------------------------------------------
#
# Webhook delivery is the default/recommended trigger. Enable the poller only
# when the bot account cannot create a hook; it consumes the same pipeline and
# discovers mentions through the issue-comments API instead.
[poller]
enabled = false
interval_secs = 15
# Empty = every repository visible to the token. The list is refreshed every
# discover_interval_secs, so newly created repositories are picked up
# automatically. Set an explicit ["owner/repo", ...] list to restrict polling.
repositories = []
discover_interval_secs = 300
lookback_secs = 3600
page_limit = 50
